<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f9;
        }
        header {
            background: #2c3e50;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        main {
            background: #fff;
            padding: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>My First Webpage</h1>
    </header>
    <main>
        <h2>About This Page</h2>
        <p>This is a sample HTML file that demonstrates: </p>
        <ul>
            <li>Semantic HTML5 structure</li>
            <li>Internal CSS styling</li>
            <li>Responsive meta tags</li>
        </ul>
    </main>
</body>
</html>
